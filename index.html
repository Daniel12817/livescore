<!DOCTYPE html>
<html>
<head>
  <title>Live Score Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>LIVE SCORE PRO</h1>
  <div id="scores">Loading live matches...</div>

<script>
let allMatches = [];
let currentFilter = "all";

async function loadMatches() {
  try {
    const today = new Date().toISOString().split('T')[0];
    const res = await fetch(`/api/matches?date=${today}`);
    const matches = await res.json();
    allMatches = matches;
    displayMatches(matches);
  } catch (err) {
    console.error(err);
    document.getElementById('scores').innerHTML = 'Error loading matches';
  }
}

function displayMatches(matches) {
  const container = document.getElementById('scores');
  if (!matches || matches.length === 0) {
    container.innerHTML = 'No matches today';
    return;
  }
  container.innerHTML = matches.map(m => `
    <div style="border:1px solid #ccc; margin:10px; padding:10px;">
      <b>${m.homeTeam?.name || m.homeTeam || ''} vs ${m.awayTeam?.name || m.awayTeam || ''}</b><br>
      ${m.state || m.status || ''} - ${m.score || ''}
    </div>
  `).join('');
}

function filterMatches(type) { /* your filter logic */ }

loadMatches();
</script>
</body>
</html>
