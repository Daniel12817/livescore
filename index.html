<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:Arial;padding:0}
.top{background:#1e293b;padding:15px;display:flex;justify-content:space-between}
#games{padding:10px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:10px}
.score{font-size:20px;font-weight:bold;text-align:center;margin:10px 0}
.row{display:flex;justify-content:space-between}
.green{color:#22c55e}
</style>
</head>
<body>
<div class="top"><b>⚽ LiveScore</b><span style="font-size:12px">API: live-football-api.com</span></div>
<div id="games" style="padding:20px;text-align:center">Loading live games...</div>
<script>
async function load(){
 try{
  let r=await fetch('/api/matches');
  let j=await r.json();
  console.log(j);
  let data=j.data||[];
  if(data.length==0){
   document.getElementById('games').innerHTML='<p>No games today<br><small>'+ (j.error||'') +'</small><br><small>'+ JSON.stringify(j).slice(0,300)+'</small></p>';
   return;
  }
  let html='';
  data.slice(0,30).forEach(m=>{
   let h=m.home_team||m.home?.name||m.teams?.home||'Home';
   let a=m.away_team||m.away?.name||m.teams?.away||'Away';
   let hs=m.home_score??m.score?.home??m.goals?.home??'-';
   let as=m.away_score??m.score?.away??m.goals?.away??'-';
   let league=m.league?.name||m.competition||'League';
   let st=m.status||'';
   html+=`<div class="card"><div style="font-size:12px;color:#94a3b8">${league} - ${st}</div><div class="row"><span>${h}</span><span>${a}</span></div><div class="score">${hs} - ${as}</div></div>`;
  });
  document.getElementById('games').innerHTML=html;
 }catch(e){
  document.getElementById('games').innerHTML='Error: '+e.message;
 }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
