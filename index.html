<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:Arial;padding-bottom:30px}.top{background:#1e293b;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.top b{font-size:19px}.api{font-size:12px;color:#22c55e}.badge{background:#22c55e;color:#000;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold}#games{max-width:700px;margin:auto;padding:15px}.card{background:#1e293b;margin:12px 0;padding:14px;border-radius:12px;border-left:4px solid #22c55e}.league{font-size:11px;color:#94a3b8;text-transform:uppercase}.row{display:flex;justify-content:space-between;margin-top:8px;font-weight:bold}.score{text-align:center;margin:10px 0;font-size:24px;font-weight:900;color:#22c55e}.status{text-align:center;font-size:12px;color:#fbbf24}
</style>
</head>
<body>
<div class="top"><b>⚽ LiveScores</b><span style="display:flex;gap:8px;align-items:center"><span class="api">API: live-football-api.com</span><span class="badge">LIVE</span></span></div>
<div id="games" style="padding:30px;text-align:center">Loading live games...</div>
<script>
async function load(){
 try{
  let r=await fetch('/api/matches'); let j=await r.json();
  console.log(j);
  let data=j.data||[];
  if(!data.length){
   document.getElementById('games').innerHTML=`<p>No games today<br><small style="color:#94a3b8">${j.error||'0 games'}<br>${j.date||''}</small></p>`; return;
  }
  let html=`<p style="color:#94a3b8;font-size:13px;margin-bottom:10px;text-align:left">${j.count} games - ${j.date} - ${j.source||''}</p>`;
  data.slice(0,100).forEach(m=>{
   let home=m.home_team?.name||m.home_team||m.teams?.home?.name||'Home';
   let away=m.away_team?.name||m.away_team||m.teams?.away?.name||'Away';
   let hs=m.home_score??m.scores?.home??m.score?.home??'-';
   let as=m.away_score??m.scores?.away??m.score?.away??'-';
   let league=m.league?.name||m.competition?.name||'League';
   let status=m.status?.short||m.status||'Live';
   html+=`<div class="card"><div class="league">${league}</div><div class="row"><span>${home}</span><span>${away}</span></div><div class="score">${hs} - ${as}</div><div class="status">${status}</div></div>`;
  });
  document.getElementById('games').innerHTML=html;
 }catch(e){document.getElementById('games').innerHTML='Error: '+e.message;}
}
load();setInterval(load,30000);
</script>
</body>
</html>
