<!DOCTYPE html>
<html>
<head>
<title>Live Score Pro - Flash Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;color:#000}
.header{background:#0a1628;color:#fff;text-align:center;padding:15px}
.header h1{font-size:22px}
.header p{color:#6b8cae;font-size:13px}
.filters{display:flex;gap:8px;padding:10px;background:#0a1628;overflow-x:auto}
.filters button{border:1px solid #1e3a5f;background:#13233f;color:#6b8cae;padding:8px 16px;border-radius:20px;white-space:nowrap}
.filters button.active{background:#0d8bf2;color:#fff;border-color:#0d8bf2}
.league-header{background:#2c2c2c;color:#fff;padding:8px 12px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between;text-transform:uppercase}
.league-header small{color:#aaa;font-weight:normal;text-transform:none}
.match-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;font-size:14px}
.match-row:nth-child(even){background:#f9f9f9}
.time{width:45px;color:#666;font-size:13px}
.teams{flex:1}
.teams b{font-weight:normal}
.score{font-weight:bold;color:#c00;min-width:35px;text-align:right}
.live-time{color:#c00;font-size:13px;width:35px}
.status{color:#666;font-size:12px}
</style>
</head>
<body>
<div class="header"><h1>⚽ LIVE SCORE PRO</h1><p id="count">Loading...</p></div>
<div class="filters">
<button class="active" onclick="filterType('all',this)">All</button>
<button onclick="filterType('live',this)">Live</button>
<button onclick="filterType('finished',this)">Finished</button>
</div>
<div id="scores">Loading matches...</div>

<script>
let all=[];
async function load(){
  let r=await fetch('/api/matches?date=2026-05-13');
  let d=await r.json();
  all=d.data||d||[];
  document.getElementById('count').innerText=all.length+' matches today';
  render(all);
}
function getLeagueInfo(m){
  let league = m.league?.name || m.competition?.name || 'Unknown League';
  let country = m.league?.country || m.country?.name || m.country || '';
  if(typeof country==='object') country=country.name||'';
  if(!country){
    if(league.includes('Major League')) country='USA';
    else if(league.includes('Serie A')||league.includes('Copa')) country='BRAZIL';
    else if(league.includes('Premier')) country='ENGLAND';
    else country='WORLD';
  }
  return {country:country.toUpperCase(), league};
}
function getTime(m){
  if(m.time) return m.time.substring(0,5);
  if(m.kickoff) return new Date(m.kickoff).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if(m.status==='Not Started' ||!m.status) {
    // Try extract from date
    try{let d=new Date(m.date||m.startTime);return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return '--:--'}
  }
  return m.minute||m.status||'';
}
function getScore(m){
  if(m.score){
    if(typeof m.score==='string' && m.score!=='vs') return m.score;
    if(m.score.home!=null) return `${m.score.home}-${m.score.away}`;
  }
  if(m.homeGoals!=null) return `${m.homeGoals}-${m.awayGoals}`;
  if(m.goals) return `${m.goals.home||0}-${m.goals.away||0}`;
  return '-';
}
function render(list){
  let box=document.getElementById('scores');
  if(!list.length){box.innerHTML='<div style="padding:20px;text-align:center;color:#666">No matches</div>';return}

  // Group by Country + League
  let groups={};
  list.forEach(m=>{
    let info=getLeagueInfo(m);
    let key=`${info.country}: ${info.league}`;
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });

  let html='';
  for(let leagueKey in groups){
    html+=`<div class="league-header"><span>${leagueKey}</span><small>Standings</small></div>`;
    groups[leagueKey].forEach(m=>{
      let home=m.homeTeam?.name||m.homeTeam||'Home';
      let away=m.awayTeam?.name||m.awayTeam||'Away';
      let timeStr=getTime(m);
      let scoreStr=getScore(m);
      let status=m.status||m.state||'';
      if(typeof status==='object') status=status.type||'';
      let isLive = String(status).toLowerCase().includes('live')||String(status).toLowerCase().includes('1h')||String(status).toLowerCase().includes('2h')|| /^\d+'/.test(status);

      let timeDisplay = isLive? `<span class="live-time">${status.includes("'")?status:timeStr+"' "}</span>` : `<span class="time">${timeStr}</span>`;
      let scoreColor = scoreStr==='-'? 'color:#666' : '';

      html+=`<div class="match-row">
        ${timeDisplay}
        <div class="teams"><b>${home} - ${away}</b></div>
        <div class="score" style="${scoreColor}">${scoreStr}</div>
      </div>`;
    });
  }
  box.innerHTML=html;
}
function filterType(t,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  if(t==='all') render(all);
  else if(t==='live') render(all.filter(m=>{let s=String(m.status||m.state||'').toLowerCase();return s.includes('live')||s.includes('1h')||s.includes('2h')|| /^\d+'/.test(s)}));
  else if(t==='finished') render(all.filter(m=>{let s=String(m.status||'').toLowerCase();return s.includes('finish')||s.includes('ft')||s.includes('full')}));
}
load();
</script>
</body>
</html>
