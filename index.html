<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nielking</title><style>
body{margin:0;font-family:Arial;background:#eaf7ea}
.top{background:#0a3d0a;color:#fff;text-align:center;padding:12px;font-weight:bold;font-size:18px}
.top span{font-size:11px;color:#a3d9a5;display:block}
.group{background:#1f3a23;color:#fff;padding:8px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between}
.link{color:#a3f3a5;text-decoration:underline;cursor:pointer;font-size:12px;background:#0a3d0a;border:1px solid #a3f3a5;padding:2px 8px;border-radius:10px}
.row{display:flex;justify-content:space-between;padding:9px;background:#f6fff6;border-bottom:1px solid #c5e1c5;font-size:14px}
.time{width:50px;color:#555}
.score{width:40px;text-align:right;font-weight:bold;color:#0a7a0a}
#popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:9999;padding:15px;overflow:auto}
#popupBox{background:#fff;border-radius:8px;padding:15px;max-width:500px;margin:20px auto}
</style></head><body>
<div class="top">⚽ NIELKING LIVESCORE<span>Top Leagues First</span></div>
<div id="box">Loading...</div>
<div id="popup"><div id="popupBox"></div></div>
<script>
const TOP_LEAGUES = [
"ENGLAND: PREMIER LEAGUE",
"SPAIN: LA LIGA",
"ITALY: SERIE A",
"GERMANY: BUNDESLIGA",
"FRANCE: LIGUE 1",
"ENGLAND: CHAMPIONSHIP",
"EUROPE: CHAMPIONS LEAGUE",
"EUROPE: EUROPA LEAGUE",
"NETHERLANDS: EREDIVISIE",
"PORTUGAL: PRIMEIRA LIGA"
];

async function load(){
  const r=await fetch('/api/matches'); const j=await r.json();
  let g={}; j.data.forEach(m=>{let k=m.country+': '+m.league; if(!g[k])g[k]=[]; g[k].push(m)});

  // SORT: Top leagues first, then A-Z
  let keys = Object.keys(g).sort((a,b)=>{
    let ia = TOP_LEAGUES.indexOf(a.toUpperCase());
    let ib = TOP_LEAGUES.indexOf(b.toUpperCase());
    if(ia!==-1 && ib!==-1) return ia-ib;
    if(ia!==-1) return -1;
    if(ib!==-1) return 1;
    return a.localeCompare(b);
  });

  let h='';
  keys.forEach(k=>{
    let first=g[k][0];
    h+=`<div class="group"><div>${k.toUpperCase()}</div><div class="link" onclick="showTable(${first.leagueId},${first.season},'${k.replace(/'/g,"")}')">Standings</div></div>`;
    g[k].forEach(m=>{
      let tm=m.isLive?(m.elapsed+"' LIVE"):m.isHT?"HT":m.timeEU;
      let sc=m.status=='NS'?'-':`${m.homeScore}-${m.awayScore}`;
      h+=`<div class="row"><div class="time">${tm}</div><div style="flex:1">${m.homeTeam} - ${m.awayTeam}</div><div class="score">${sc}</div></div>`;
    });
  });
  document.getElementById('box').innerHTML=h || 'No matches today';
}
async function showTable(league,season,name){
  document.getElementById('popup').style.display='block';
  document.getElementById('popupBox').innerHTML=`<h3>${name}</h3>Loading...<br><br><button onclick="document.getElementById('popup').style.display='none'" style="background:red;color:white;padding:8px;border:none;border-radius:5px">Close</button>`;
  try{
    const r=await fetch(`/api/standings?league=${league}&season=${season}`);
    const j=await r.json();
    let t=j.response[0]?.league?.standings[0];
    if(!t){ document.getElementById('popupBox').innerHTML=`<h3>${name}</h3>No standings<br><button onclick="document.getElementById('popup').style.display='none'" style="background:red;color:white;padding:8px">Close</button>`; return; }
    let html=`<h3>${name} TABLE</h3><button onclick="document.getElementById('popup').style.display='none'" style="background:red;color:white;padding:8px;border:none;border-radius:5px;margin-bottom:10px">✖ Close</button><table style="width:100%;border-collapse:collapse"><tr style="background:#0a3d0a;color:#fff"><th>#</th><th>Team</th><th>Pts</th><th>W</th></tr>`;
    t.forEach(row=>{html+=`<tr style="border-bottom:1px solid #ddd"><td>${row.rank}</td><td>${row.team.name}</td><td><b>${row.points}</b></td><td>${row.all.win}</td></tr>`});
    html+=`</table>`; document.getElementById('popupBox').innerHTML=html;
  }catch(e){ document.getElementById('popupBox').innerHTML='Error'; }
}
load();
</script></body></html>
