<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nielking Livescore - All Leagues</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0e1116;color:#fff}
.header{background:#161a23;padding:12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ff3b30}
.header h1{color:#ff3b30;font-size:20px}
.date-bar{display:flex;gap:6px;padding:10px;background:#161a23;overflow-x:auto}
.date-bar button{background:#222834;border:1px solid #333;color:#ccc;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.date-bar button.active{background:#ff3b30;color:#fff;border-color:#ff3b30}
.league-group{margin:10px 6px;background:#1a1f2b;border-radius:10px;overflow:hidden}
.league-head{background:#222834;padding:10px 12px;display:flex;align-items:center;font-weight:bold;font-size:13px;color:#ccc;text-transform:uppercase}
.league-logo{width:18px;height:18px;margin-right:8px;object-fit:contain}
.match{display:flex;align-items:center;justify-content:space-between;padding:12px;border-top:1px solid #252b3a}
.match:first-child{border-top:none}
.time{font-size:12px;color:#8a93a8;min-width:50px}
.teams{flex:1;margin-left:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.team{display:flex;align-items:center;gap:6px}
.team-logo{width:18px;height:18px;object-fit:contain;border-radius:2px}
.score{font-weight:bold;min-width:40px;text-align:center;background:#222834;padding:4px 8px;border-radius:6px}
.live{color:#ff3b30;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<div class="header"><h1>Nielking Livescore ⚽ ALL LEAGUES</h1></div>
<div class="date-bar" id="dateBar"></div>
<div id="content"><div class="loading">Loading all leagues...</div></div>

<script>
const dateBar = document.getElementById('dateBar');
const content = document.getElementById('content');

// Create 7 days bar
for(let i=-2;i<=4;i++){
  const d=new Date(); d.setDate(d.getDate()+i);
  const iso=d.toISOString().split('T')[0];
  const btn=document.createElement('button');
  btn.textContent = i===0? 'Today' : d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  if(i===0) btn.className='active';
  btn.onclick=()=>{document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadMatches(iso);};
  dateBar.appendChild(btn);
  if(i===0) window.todayISO=iso;
}
