<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:0;font-family:Arial;background:#0d5a3a;color:#fff;overflow-x:hidden}
.top{background:#0d5a3a;color:#fff;text-align:center;padding:12px;font-weight:bold;width:100%;box-sizing:border-box}
.bar{display:flex;gap:6px;padding:6px 10px;background:#073422;overflow:auto;width:100%;box-sizing:border-box}
.bar button{padding:7px 12px;border-radius:12px;border:none;white-space:nowrap;font-weight:bold;background:#1a5a3a;color:#fff}
.bar .active{background:#00d084;color:#000}
.bar2{display:flex;gap:6px;padding:6px 10px;background:#0f2942;border-top:1px solid #1a5a5a;width:100%;box-sizing:border-box}
.bar2 button{padding:6px 10px;border-radius:10px;border:none;font-weight:bold;font-size:13px;background:#1a1a1a;color:#fff}
.bar2 button.active{border:2px solid #00d084;background:#fff;color:#000}
#box{width:100%;box-sizing:border-box;padding:0;margin:0;background:#f5f5f5;min-height:400px}
.league{background:#e7e7e7;color:#333;padding:6px 10px;font-weight:bold;font-size:13px;border-top:1px solid #ccc;display:flex;justify-content:space-between}
.match{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #ddd;background:#fff;color:#000;font-size:14px}
.t{color:#0044ff;font-weight:bold;min-width:50px}
.s{color:#ff0000;font-weight:bold}
#pop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:99}
#popBox{background:#fff;color:#000;border-radius:10px;padding:15px;max-width:500px;margin:20px auto}
</style></head><body>

<div class="top">⚽ NIELKING LIVESCORE ⚽</div>

<a href="https://wa.me/2349130441227?text=Hello%20I%20want%20to%20advertise%20on%20Nielking" style="display:block;background:#ffcc00;color:#000;text-align:center;padding:10px 0;font-weight:bold;text-decoration:none;width:100%;box-sizing:border-box">📢 ADVERTISE HERE - 150x300 - Click to Chat on WhatsApp</a>

<a href="https://wa.me/2349130441227?text=Hello%20I%20want%20to%20advertise" style="display:block;background:#e6004c;color:#fff;text-align:center;padding:10px 0;font-weight:bold;text-decoration:none;width:100%;box-sizing:border-box">📢 ADVERTISE HERE - 728x90 - Click to Chat</a>

<div class="bar">
<button id="t1" class="active" onclick="setD('today')">Today</button>
<button id="t2" onclick="setD('yesterday')">Yesterday</button>
<button id="t3" onclick="setD('tomorrow')">Tomorrow</button>
</div>

<div class="bar2">
<button id="b1" class="active" style="background:#1a1a1a;color:#00d4ff" onclick="setF('all')">All Games</button>
<button id="b2" style="background:#1a1a1a;color:#333" onclick="setF('live')">LIVE</button>
<button id="b3" style="background:#00d4ff;color:#000" onclick="setF('finished')">Finished</button>
<button id="b2r" style="background:#00d4ff;color:#000" onclick="loadData()">↻ REFRESH</button>
</div>

<div id="box"></div>
<div id="pop"><div id="popBox"></div></div>

<script>
const TOP="ENGLAND, PREMIER LEAGUE, SPAIN: LA LIGA, ITALY: SERIE A, GERMANY: BUNDESLIGA";
let curD="today", curF="all", all=[];

function getDS(t){let d=new Date(); if(t=="yesterday")d.setDate(d.getDate()-1); if(t=="tomorrow")d.setDate(d.getDate()+1); return d.toISOString().split('T')[0];}

function setD(t){
  curD=t; document.getElementById('t1').classList.toggle('active',t=='today'); document.getElementById('t2').classList.toggle('active',t=='yesterday'); document.getElementById('t3').classList.toggle('active',t=='tomorrow');
  loadData();
}
function setF(f){curF=f; render();}

async function loadData(){
  document.getElementById('box').innerHTML='<div style="padding:30px;text-align:center;color:#333">Loading matches... ⚽</div>';
  let ds=getDS(curD);
  try{
    let r=await fetch('/api/matches?date='+ds);
    let j=await r.json();
    all=j.data||[];
    render();
  }catch(e){
    document.getElementById('box').innerHTML='<div style="padding:30px;color:red;text-align:center">No matches found for '+ds+'. Try Refresh.</div>';
  }
}

function render(){
  let box=document.getElementById('box');
  if(!all || all.length==0){box.innerHTML='<div style="padding:30px;text-align:center;color:#333">No matches today. Click REFRESH or try Yesterday/Tomorrow.<br><br>Free plan: 100 req/day - cached.</div>';return;}

  let filtered=all;
  if(curF=='live') filtered=all.filter(m=>m.isLive);
  if(curF=='finished') filtered=all.filter(m=>m.isFinished);

  // Group by league
  let groups={};
  filtered.forEach(m=>{let k=m.country+' - '+m.league; if(!groups[k])groups[k]=[]; groups[k].push(m);});

  let html='';
  for(let lg in groups){
    html+='<div class="league"><span>'+lg+'</span><span>Standings</span></div>';
    groups[lg].forEach(m=>{
      let timeColor = m.isLive? 'color:red' : 'color:#0044ff';
      let score = (m.homeScore!=null)? m.homeScore+' - '+m.awayScore : 'vs';
      html+='<div class="match"><span><span class="t" style="'+timeColor+'">'+m.timeEU+'</span> '+m.homeTeam+' - '+m.awayTeam+'</span><span class="s">'+score+'</span></div>';
    });
  }
  box.innerHTML=html || '<div style="padding:20px;color:#333">No '+curF+' matches.</div>';
}

loadData();
</script>
</body></html>
