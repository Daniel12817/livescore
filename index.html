<!DOCTYPE html>
<html>
<head><title>Live Score Pro</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a1628;color:#fff}.header{background:#0a1930;text-align:center;padding:20px}.header p{color:#6b8cae}.filters{display:flex;gap:10px;padding:15px;overflow-x:auto;background:#0a1930}.filters button{border:2px solid #1e3a5f;background:transparent;color:#6b8cae;padding:10px 20px;border-radius:25px}.filters button.active{background:#0d8bf2;border-color:#0d8bf2;color:#fff}#scores{padding:10px}.match{background:#13233f;border-radius:12px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;border:1px solid #1e3a5f}.teams small{color:#6b8cae}</style>
</head>
<body>
<div class="header"><h1>⚽ LIVE SCORE PRO</h1><p id="count">Loading...</p></div>
<div class="filters">
<button class="active" onclick="showAll()">All Games</button>
<button onclick="showLive()"><span style="width:10px;height:10px;background:red;display:inline-block;border-radius:50%"></span> Live</button>
<button onclick="showFinished()">Finished</button>
</div>
<div id="scores">Loading...</div>
<script>
let all=[];
async function load(){let r=await fetch('/api/matches?date=2026-05-13');let d=await r.json();all=d.data||d||[];document.getElementById('count').innerText=all.length+' matches today';showAll()}
function render(list){let box=document.getElementById('scores');if(!list.length){box.innerHTML='No matches';return}box.innerHTML=list.map(m=>{let h=m.homeTeam?.name||m.homeTeam||'Home';let a=m.awayTeam?.name||m.awayTeam||'Away';let l=m.league?.name||'';let st=m.status||m.state||'';if(typeof st==='object')st=st.type||st.name||'';let sc='vs';if(m.score){sc=typeof m.score==='string'?m.score:(m.score.home??0)+'-'+(m.score.away??0)}else if(m.homeGoals!=null)sc=m.homeGoals+'-'+m.awayGoals;return`<div class="match"><div class="teams"><b>${h} vs ${a}</b><br><small>${l}</small></div><div><b>${sc}</b><br><small>${st}</small></div></div>`}).join('')}
function showAll(){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.filters button')[0].classList.add('active');render(all)}
function showLive(){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.filters button')[1].classList.add('active');let f=all.filter(m=>{let s=String(m.status||m.state||'').toLowerCase();return s.includes('live')||s.includes('1h')||s.includes('2h')});render(f)}
function showFinished(){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.filters button')[2].classList.add('active');let f=all.filter(m=>{let s=String(m.status||m.state||'').toLowerCase();return s.includes('finish')||s.includes('ft')});render(f)}
load();
</script>
</body>
</html>
