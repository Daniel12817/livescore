<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore - Your API</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:12px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.date-bar{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#1e293b}
.date-bar button{padding:6px 12px;border-radius:20px;border:1px solid #334155;background:transparent;color:white;white-space:nowrap}
.date-bar button.active{background:#22c55e;color:black;font-weight:bold}
.filter-bar{display:flex;gap:8px;padding:10px;background:#0f172a}
.filter-bar button{padding:6px 14px;border-radius:6px;border:none;background:#1e293b;color:white}
.filter-bar button.active{background:white;color:black}
.card{background:#1e293b;margin:8px;border-radius:10px;padding:12px}
.league{font-size:12px;color:#94a3b8;margin-bottom:6px}
.match{display:flex;justify-content:space-between;align-items:center}
.team{flex:1}
.score{font-weight:bold;font-size:18px}
.live{color:#22c55e;font-size:12px}
.loading{padding:40px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div class="header"><h3 style="margin:0">LiveScore</h3><span id="status">Your API: apisport.online</span></div>
<div class="date-bar" id="dateBar"></div>
<div class="filter-bar">
<button class="filter-btn active" data-f="all">All Games</button>
<button class="filter-btn" data-f="live">LIVE</button>
<button class="filter-btn" data-f="finished">Finished</button>
</div>
<div id="games"><div class="loading">Loading from your API...</div></div>

<script>
let all=[],curF="all",curDate="";
function fmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}
function build(){
  let h='<button class="date-btn active" data-date="">Today</button>';
  for(let i=-3;i<=4;i++){let d=new Date();d.setDate(new Date().getDate()+i);let ds=d.toISOString().split('T')[0];h+=`<button class="date-btn" data-date="${ds}">${fmt(d)}</button>`}
  document.getElementById('dateBar').innerHTML=h;
}
function pick(el){document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function filt(f){document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-f="${f}"]`).classList.add('active')}

async function load(date=""){
  document.getElementById('games').innerHTML='<div class="loading">Loading from YOUR API...</div>';
  try{
    let url=`/api/matches${date?`?date=${date}`:''}`;
    let r=await fetch(url,{cache:'no-store'});
    let data=await r.json();
    all=data.data||[];
    if(all.length===0){
      let msg=data.api_error||data.error||"No games for this date from your API. Try Today or Yesterday.";
      document.getElementById('games').innerHTML=`<div class="loading">${msg}<br><small>API response: ${JSON.stringify(data).slice(0,200)}</small></div>`;
      return;
    }
    render();
  }catch(e){
    document.getElementById('games').innerHTML=`<div class="loading">Error loading your API: ${e.message}</div>`;
  }
}
function render(){
  let list=all;
  if(curF==="live")list=list.filter(x=>x.isLive);
  if(curF==="finished")list=list.filter(x=>x.isFinished);
  if(list.length===0){
    document.getElementById('games').innerHTML='<div class="loading">No games for this filter</div>';return;
  }
  document.getElementById('games').innerHTML=list.map(g=>`
    <div class="card">
      <div class="league">${g.country} - ${g.league}</div>
      <div class="match">
        <div class="team">${g.homeTeam}</div>
        <div class="score">${g.homeScore} - ${g.awayScore} <span class="${g.isLive?'live':''}">${g.minute}</span></div>
        <div class="team" style="text-align:right">${g.awayTeam}</div>
      </div>
    </div>
  `).join('');
}

document.addEventListener('click',e=>{
  if(e.target.classList.contains('date-btn')){pick(e.target);curDate=e.target.dataset.date;load(curDate)}
  if(e.target.classList.contains('filter-btn')){filt(e.target.dataset.f);curF=e.target.dataset.f;render()}
});

build();load();
</script>
</body>
</html>
