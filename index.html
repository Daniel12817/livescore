<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nielking Livescore</title>
<style>body{margin:0;background:#fff;color:#000;font-family:Arial;font-size:13px}.top{background:#1b4332;color:#fff;padding:12px;text-align:center;font-weight:bold}.ad{margin:6px;padding:8px;text-align:center;font-weight:bold}.ad1{background:#ffcc00}.ad2{background:#00d4ff}.date{display:flex;background:#eee}.date button{flex:1;padding:8px;border:1px solid #ccc;background:#fff}.date button.active{background:#000;color:#fff}.filt{display:flex}.filt button{flex:1;padding:8px;border:1px solid #ccc;background:#fff;font-weight:bold}.filt button.active{background:#000;color:#fff}.league{background:#000;color:#fff;padding:6px 8px;display:flex;justify-content:space-between;font-weight:bold;text-transform:uppercase}.match{padding:6px 8px;border-bottom:1px solid #ddd;display:flex;gap:8px}.live{color:red;font-weight:bold}</style></head><body>
<div class="top">⚽ NIELKING LIVESCORE</div>
<div class="ad ad1">ADVERT 1 - CLICK HERE</div>
<div class="ad ad2">WhatsApp Us</div>
<div class="date"><button onclick="setDate(-1)">Yesterday</button><button class="active" onclick="setDate(0)">Today</button><button onclick="setDate(1)">Tomorrow</button></div>
<div class="filt"><button class="active" id="a" onclick="fil('all')">All</button><button id="l" onclick="fil('live')">LIVE</button><button id="f" onclick="fil('finished')">Finished</button><button onclick="load()">↻</button></div>
<div id="c" style="padding:20px;text-align:center">Loading...</div>
<script>
let all=[],f='all',d=new Date().toISOString().split('T')[0];
function setDate(o){let x=new Date();x.setDate(x.getDate()+o);d=x.toISOString().split('T')[0];load()}
function fil(v){f=v;document.querySelectorAll('.filt button').forEach(b=>b.classList.remove('active'));document.getElementById(v==='all'?'a':v==='live'?'l':'f').classList.add('active');render()}
async function load(){document.getElementById('c').innerHTML='Loading...';try{let r=await fetch('/api/matches?date='+d);let j=await r.json();all=j.data||[];render()}catch(e){document.getElementById('c').innerHTML='Error loading'}}
function render(){let data=all;if(f==='live')data=data.filter(x=>x.isLive);if(f==='finished')data=data.filter(x=>x.isFinished);if(!data.length){document.getElementById('c').innerHTML='No games';return}
let g={};data.forEach(m=>{let k=m.country+': '+m.league;if(!g[k])g[k]=[];g[k].push(m)});
let h='';for(let k in g){h+=`<div class="league"><span>${k}</span><span style="text-decoration:underline">Standings</span></div>`;g[k].forEach(m=>{h+=`<div class="match"><span class="${m.isLive?'live':''}">${m.minute}</span><span>${m.homeTeam} - ${m.awayTeam} - ${m.homeScore}-${m.awayScore}</span></div>`})}
document.getElementById('c').innerHTML=h}
load();
</script></body></html>
