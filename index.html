<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nielking</title><style>
body{margin:0;font-family:Arial;background:#0a1929}
.top{background:#0a3d0a;color:#fff;text-align:center;padding:12px;font-weight:bold}
.ad{background:#ffcc00;color:#000;text-align:center;padding:12px;font-weight:bold;font-size:12px;border:2px dashed #000;margin:5px;border-radius:8px;display:block}
.bar{display:flex;gap:8px;padding:10px;background:#0f2942;overflow:auto}
.b{padding:12px 20px;border-radius:10px;border:none;font-weight:bold;background:#1a3a5a;color:#00d4ff}
.b.active{background:#00d4ff;color:#000}
.bar2{display:flex;gap:8px;padding:10px;background:#0f2942;border-top:1px solid #1a3a5a}
.b2{padding:12px 16px;border-radius:10px;border:none;font-weight:bold;font-size:13px}
.g{background:#1f3a23;color:#fff;padding:8px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between}
.lk{color:#a3f3a5;border:1px solid #a3f3a5;background:#0a3d0a;padding:2px 8px;border-radius:10px;font-size:12px;cursor:pointer}
.r{display:flex;justify-content:space-between;padding:9px;background:#f6fff6;border-bottom:1px solid #c5e1c5;font-size:14px;color:#000}
#pop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:999;padding:10px;overflow:auto}
#popBox{background:#fff;color:#000;border-radius:8px;padding:15px;max-width:500px;margin:20px auto}
</style></head><body>

<div class="top">⚽ NIELKING LIVESCORE</div>

<a href="https://wa.me/2348022817688?text=Hello%20I%20want%20to%20advertise%20on%20Nielking" target="_blank" style="text-decoration:none">
<div class="ad" style="background:#ffcc00;cursor:pointer">🔥 ADVERT 1 - CLICK HERE TO ADVERTISE 🔥</div>
</a>

<a href="https://wa.me/2348022817688?text=Hello%20I%20want%20to%20advertise%20on%20Nielking" target="_blank" style="text-decoration:none">
<div class="ad" style="background:#00d4ff;cursor:pointer">💰 ADVERT 2 - CLICK HERE - WhatsApp Us 💰</div>
</a>

<div class="bar">
<button id="t1" class="b active" onclick="setD('today')">Today</button>
<button id="t2" class="b" onclick="setD('yesterday')">Yesterday</button>
<button id="t3" class="b" onclick="setD('tomorrow')">Tomorrow</button>
</div>

<div class="bar2">
<button class="b2" style="background:#1a3a5a;color:#00d4ff" onclick="setF('all')">All Games</button>
<button class="b2" style="background:#1a3a5a;color:#ff3333" onclick="setF('live')">LIVE</button>
<button class="b2" style="background:#00d4ff;color:#000" onclick="setF('finished')">Finished</button>
<button class="b2" style="background:#00d4ff;color:#000" onclick="loadData()">↻ REFRESH</button>
</div>

<div id="box" style="color:#fff;padding:20px;text-align:center">Loading matches...</div>
<div id="pop"><div id="popBox"></div></div>

<script>
const TOP=["ENGLAND: PREMIER LEAGUE","SPAIN: LA LIGA","ITALY: SERIE A","GERMANY: BUNDESLIGA","FRANCE: LIGUE 1","ENGLAND: CHAMPIONSHIP","EUROPE: CHAMPIONS LEAGUE","EUROPE: EUROPA LEAGUE","NETHERLANDS: EREDIVISIE","PORTUGAL: PRIMEIRA LIGA"];
let curD='today', curF='all', all=[];
function getDS(t){let d=new Date(); if(t=='yesterday')d.setDate(d.getDate()-1); if(t=='tomorrow')d.setDate(d.getDate()+1); return d.toISOString().split('T')[0];}
function setD(t){curD=t; document.getElementById('t1').classList.toggle('active',t=='today'); document.getElementById('t2').classList.toggle('active',t=='yesterday'); document.getElementById('t3').classList.toggle('active',t=='tomorrow'); loadData();}
function setF(f){curF=f; render();}
async function loadData(){
 let ds=getDS(curD);
 try{
   let r=await fetch('/api/matches?date='+ds);
   let j=await r.json();
   all=j.data||[];
   render();
 }catch(e){ document.getElementById('box').innerHTML='<div style="color:red">Error loading - check API key</div>'; }
}
function render(){
 let fil=all; if(curF=='live') fil=all.filter(m=>m.isLive||m.isHT); if(curF=='finished') fil=all.filter(m=>m.isFinished);
 if(fil.length==0){document.getElementById('box').innerHTML='<div style="padding:60px;text-align:center;color:#777;background:#000"><h2>0 MATCHES</h2><p>Try Refresh or check API limit</p></div>'; return;}
 let g={}; fil.forEach(m=>{let k=m.country+': '+m.league; if(!g[k])g[k]=[]; g[k].push(m)});
 let keys=Object.keys(g).sort((a,b)=>{let ia=TOP.indexOf(a.toUpperCase()),ib=TOP.indexOf(b.toUpperCase()); if(ia!=-1&&ib!=-1)return ia-ib; if(ia!=-1)return -1; if(ib!=-1)return 1; return a.localeCompare(b);});
 let h=''; keys.forEach(k=>{let f=g[k][0]; h+=`<div class="g"><div>${k.toUpperCase()}</div><div class="lk" onclick="showT(${f.leagueId},${f.season},'${k.replace(/'/g,"")}')">Standings</div></div>`; g[k].forEach(m=>{let tm=m.isLive?m.elapsed+"' LIVE":m.isHT?"HT":m.isFinished?"FT":m.timeEU; let sc=m.status=='NS'?'-':m.homeScore+'-'+m.awayScore; h+=`<div class="r"><div style="width:55px;color:#666">${tm}</div><div style="flex:1">${m.homeTeam} - ${m.awayTeam}</div><div style="width:40px;text-align:right;font-weight:bold;color:#0a7a0a">${sc}</div></div>`;});}); document.getElementById('box').innerHTML=h;
}
async function showT(l,s,n){document.getElementById('pop').style.display='block'; document.getElementById('popBox').innerHTML='<h3>'+n+'</h3>Loading...'; try{let r=await fetch('/api/standings?league='+l+'&season='+s); let j=await r.json(); let t=j.response[0]?.league?.standings[0]; if(!t)return; let html='<h3>'+n+'</h3><button onclick="document.getElementById(\'pop\').style.display=\'none\'" style="background:red;color:white;padding:6px">✖ Close</button><table style="width:100%;border-collapse:collapse;margin-top:10px"><tr style="background:#0a3d0a;color:#fff"><th>#</th><th>Team</th><th>Pts</th></tr>'; t.forEach(r=>{html+='<tr style="border-bottom:1px solid #ddd"><td>'+r.rank+'</td><td>'+r.team.name+'</td><td><b>'+r.points+'</b></td></tr>';}); html+='</table>'; document.getElementById('popBox').innerHTML=html;}catch(e){}}
loadData(); setInterval(loadData,120000);
</script></body></html>
