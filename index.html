<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nielking Livescore</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#121317;color:#fff;font-family:Arial}.top{background:#1a4d2e;padding:14px;text-align:center;font-weight:bold}.ad{margin:8px;border-radius:6px;padding:10px;text-align:center;font-weight:bold}.ad1{background:#ffcc00;color:#000}.ad2{background:#00d4ff;color:#000}.date-bar{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#1e1f26}.date-bar button{background:#2a2c36;border:none;color:#aaa;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap;min-width:80px}.date-bar button.active{background:#e53935;color:#fff}.filter-bar{display:flex;gap:8px;padding:0 10px 12px;background:#1e1f26}.filter-bar button{background:#2a2c36;border:none;color:#aaa;padding:10px 14px;border-radius:20px;font-size:12px}.filter-bar button.active{background:#fff;color:#000}.league{background:#2a2c36;margin:10px 8px;border-radius:10px;overflow:hidden}.league-head{background:#252731;padding:10px 12px;font-size:12px;color:#fff;font-weight:bold;text-transform:uppercase}.match{display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:1px solid #1e1f26}.match-left{color:#888;font-size:11px;min-width:75px}.score{padding:6px 12px;border-radius:8px;font-weight:bold;min-width:45px;text-align:center}.score.live{background:#e53935}.score.notlive{background:#2f3240}.loading{padding:40px;text-align:center;color:#888}</style></head><body><div class="top">⚽ NIELKING LIVESCORE</div><div class="ad ad1">ADVERT 1</div><div class="ad ad2">ADVERT 2</div><div class="date-bar" id="db"></div><div class="filter-bar"><button class="active" id="fa" onclick="fil('all')">All Games</button><button id="fl" onclick="fil('live')">LIVE</button><button id="ff" onclick="fil('finished')">Finished</button><button onclick="location.reload()">↻</button></div><div id="c"><div class="loading">Loading...</div></div><script>
let all=[],curF='all',curDate='';function fmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}
function build(){let h='',t=new Date();for(let i=-3;i<=4;i++){let d=new Date();d.setDate(t.getDate()+i);let iso=d.toISOString().split('T')[0];let lab=i==0?'Today':fmt(d);let act=i==0?'active':'';if(i==0)curDate=iso;h+=`<button class="${act}" data-iso="${iso}" onclick="pick(this)">${lab}</button>`}document.getElementById('db').innerHTML=h}
function pick(el){document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');curDate=el.dataset.iso;load()}
function fil(f){curF=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));document.getElementById(f=='all'?'fa':f=='live'?'fl':'ff').classList.add('active');render()}
async function load(){document.getElementById('c').innerHTML='<div class="loading">Loading...</div>';try{let r=await fetch('/api/matches?date='+curDate);let j=await r.json();all=j.data||[];render()}catch{}}
function render(){let data=all;if(curF=='live')data=data.filter(x=>x.isLive);if(curF=='finished')data=data.filter(x=>x.isFinished);if(!data.length){document.getElementById('c').innerHTML='<div class="loading">No games</div>';return}let g={};data.forEach(m=>{let k=m.country+' - '+m.league;if(!g[k])g[k]=[];g[k].push(m)});let html='';for(let k in g){html+=`<div class="league"><div class="league-head"><span>${k} (${g[k].length})</span></div>`;g[k].forEach(m=>{html+=`<div class="match"><div class="match-left">${m.isLive?'LIVE '+m.minute:m.minute}</div><div>⚽ ${m.homeTeam}<br>⚽ ${m.awayTeam}</div><div class="score ${m.isLive?'live':'notlive'}">${m.homeScore}-${m.awayScore}</div></div>`});html+=`</div>`}document.getElementById('c').innerHTML=html}
build();load();
</script></body></html>
