<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Score</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#111;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:18px}
.tabs{display:flex;justify-content:center;gap:10px;padding:10px}
.tabs button{padding:8px 18px;border-radius:20px;border:1px solid #111;background:#fff;cursor:pointer}
.tabs button.active{background:#111;color:#fff}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.league{font-size:12px;color:gray}
.match{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:bold}
.score{color:#111}
.status{font-size:12px;color:green;margin-top:5px}
#loading{text-align:center;padding:30px}
</style>
</head>
<body>
<div class="header">⚽ LIVE SCORE</div>
<div class="tabs">
<button class="active" onclick="filterMatches('all',this)">All</button>
<button onclick="filterMatches('live',this)">Live</button>
<button onclick="filterMatches('finished',this)">Finished</button>
</div>
<div id="loading">Loading matches...</div>
<div id="list"></div>

<script>
let allMatches = [];
async function load(){
  try{
    const res = await fetch('/api/matches');
    const json = await res.json();
    allMatches = json.data || [];
    document.getElementById('loading').style.display='none';
    if(allMatches.length===0){
      document.getElementById('list').innerHTML='<p style="text-align:center">No matches today</p>';
      return;
    }
    render(allMatches);
  }catch(err){
    document.getElementById('loading').innerHTML='Error Failed to fetch - check internet and use https://livescore-psi-two.vercel.app';
  }
}
function render(data){
  const list=document.getElementById('list');
  list.innerHTML='';
  data.forEach(m=>{
    list.innerHTML+=`<div class="card">
      <div class="league">${m.league}</div>
      <div class="match"><span>${m.homeTeam}</span><span class="score">${m.homeScore} - ${m.awayScore}</span><span>${m.awayTeam}</span></div>
      <div class="status">${m.status}</div>
    </div>`;
  });
}
function filterMatches(type,btn){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(type==='all') render(allMatches);
  if(type==='live') render(allMatches.filter(m=>m.isLive));
  if(type==='finished') render(allMatches.filter(m=>!m.isLive));
}
load();
</script>
</body>
</html>
