<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nielking LiveScore - Real Scores</title>
<style>
body{font-family:Arial;background:#0a0e1a;color:white;margin:0;padding:15px}
h1{text-align:center;color:#00ff88}
.header{text-align:center;margin-bottom:20px}
.match{background:#151a2a;border-radius:12px;padding:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #333}
.match.live{border-left-color:#ff0000;background:#1f1220}
.teams{flex:1}
.team{font-weight:bold}
.league{font-size:11px;color:#888;margin-bottom:5px}
.score{font-size:22px;font-weight:bold;text-align:center;min-width:80px}
.live-dot{color:#ff0000;font-size:11px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.time{font-size:11px;color:#aaa}
.loading{text-align:center;padding:50px}
</style>
</head>
<body>
<div class="header">
<h1>⚽ Nielking LiveScore</h1>
<div id="count">Loading real scores...</div>
</div>
<div id="matches"></div>

<script>
async function loadScores(){
  try{
    const r = await fetch('/api/matches');
    const j = await r.json();
    document.getElementById('count').innerText = j.count + ' matches today - ' + new Date().toLocaleTimeString();
    let html='';
    if(j.data.length==0) html='<div class=loading>No matches today, check tomorrow!</div>';
    j.data.forEach(m=>{
      html+=`
      <div class="match ${m.isLive?'live':''}">
        <div class="teams">
          <div class="league">${m.league} ${m.isLive?'<span class=live-dot>● LIVE</span>':''}</div>
          <div class="team">${m.homeTeam}</div>
          <div class="team">${m.awayTeam}</div>
        </div>
        <div class="score">
          ${m.homeScore} - ${m.awayScore}
          <div class="time">${m.status}</div>
        </div>
      </div>`;
    });
    document.getElementById('matches').innerHTML=html;
  }catch(e){
    document.getElementById('matches').innerHTML='Error loading - refresh';
  }
}
loadScores();
setInterval(loadScores, 30000); // refresh every 30 sec for real livescore
</script>
</body>
</html>
