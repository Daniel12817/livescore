<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nielking Livescore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a2e2b;color:#fff;font-family:Arial}
.top{background:#1b4332;padding:12px;text-align:center;font-weight:bold;font-size:18px}
.advert{margin:8px;padding:10px;text-align:center;border-radius:6px;font-weight:bold;cursor:pointer}
.ad1{background:#ffcc00;color:#000;border:2px dashed #000}
.ad2{background:#00d4ff;color:#000}
.date-bar{display:flex;gap:8px;padding:10px}
.date-bar button{flex:1;background:#1e3d3a;border:none;color:#00d4ff;padding:10px;border-radius:10px;font-weight:bold;cursor:pointer}
.date-bar button.active{background:#00d4ff;color:#000}
.filter-bar{display:flex;gap:8px;padding:0 10px 10px}
.filter-bar button{flex:1;background:#1e3d3a;border:none;color:#ccc;padding:10px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer}
.filter-bar button.active{background:#00d4ff;color:#000}
.league{margin:8px;background:#fff;border-radius:6px;overflow:hidden;color:#000}
.league-head{background:#0f2e2b;color:#fff;padding:8px 10px;font-size:12px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.standings{border:1px solid #00ff88;color:#00ff88;padding:2px 10px;border-radius:15px;font-size:11px}
.match{display:flex;justify-content:space-between;align-items:center;padding:10px;border-top:1px solid #eee;font-size:14px}
.time{color:#ff3b30;font-size:13px;min-width:45px;font-weight:bold}
.time.finished{color:#666}
.score{font-weight:bold;color:#000}
.score.live{color:#ff3b30}
.loading{padding:40px;text-align:center;color:#ccc}
</style>
</head>
<body>
<div class="top">⚽ NIELKING LIVESCORE</div>
<div class="advert ad1" onclick="window.open('https://wa.me/2348100000000','_blank')">🔥 ADVERT 1 - CLICK HERE 🔥</div>
<div class="advert ad2" onclick="window.open('https://wa.me/2348100000000','_blank')">💰 ADVERT 2 - WhatsApp Us 💰</div>

<div class="date-bar">
<button class="active" id="d-today" onclick="setDate('today')">Today</button>
<button id="d-yest" onclick="setDate('yest')">Yesterday</button>
<button id="d-tom" onclick="setDate('tom')">Tomorrow</button>
</div>

<div class="filter-bar">
<button class="active" id="f-all" onclick="setFilter('all')">All Games</button>
<button id="f-live" onclick="setFilter('live')">LIVE</button>
<button id="f-fin" onclick="setFilter('finished')">Finished</button>
<button id="f-ref" onclick="doRefresh()">↻ REFRESH</button>
</div>

<div id="content"><div class="loading">Loading...</div></div>

<script>
let allData=[], currentFilter='all', currentDateISO='';
function getISO(o){let d=new Date();d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
currentDateISO=getISO(0);
function setDate(type){
 document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active'));
 if(type==='today'){currentDateISO=getISO(0);document.getElementById('d-today').classList.add('active');}
 if(type==='yest'){currentDateISO=getISO(-1);document.getElementById('d-yest').classList.add('active');}
 if(type==='tom'){currentDateISO=getISO(1);document.getElementById('d-tom').classList.add('active');}
 loadMatches(currentDateISO);
}
function setFilter(f){
 currentFilter=f;
 document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));
 if(f==='all')document.getElementById('f-all').classList.add('active');
 if(f==='live')document.getElementById('f-live').classList.add('active');
 if(f==='finished')document.getElementById('f-fin').classList.add('active');
 doRefresh();
}
function doRefresh(){loadMatches(currentDateISO);}
async function loadMatches(date){
 document.getElementById('content').innerHTML=`<div class="loading">Loading ${date}...</div>`;
 try{
  const res=await fetch(`/api/matches?date=${date}`);
  const json=await res.json();
  allData=json.data||[];
  render();
 }catch(e){document.getElementById('content').innerHTML=`<div class="loading">Error ${e.message}</div>`;}
}
function render(){
 let data=allData;
 if(currentFilter==='live') data=data.filter(m=>m.isLive);
 if(currentFilter==='finished') data=data.filter(m=>m.isFinished);
 if(!data.length){document.getElementById('content').innerHTML=`<div class="loading">No ${currentFilter} games</div>`;return;}
 const groups={};
 data.forEach(m=>{
  const key=`${m.country}: ${m.league}`;
  if(!groups[key]) groups[key]=[];
  groups[key].push(m);
 });
 let html='';
 for(const key in groups){
  const ms=groups[key];
  html+=`<div class="league"><div class="league-head"><span>${key.toUpperCase()}</span><span class="standings">Standings</span></div>`;
  ms.forEach(m=>{
   const isLiveClass = m.isFinished? 'finished' : '';
   html+=`<div class="match"><div class="time ${isLiveClass}">${m.minute}</div><div style="flex:1;text-align:center">${m.homeTeam} - ${m.awayTeam}</div><div class="score ${m.isLive?'live':''}">${m.homeScore}-${m.awayScore}</div></div>`;
  });
  html+=`</div>`;
 }
 document.getElementById('content').innerHTML=html;
}
loadMatches(currentDateISO);
setInterval(()=>loadMatches(currentDateISO), 30000);
</script>
</body>
</html>
